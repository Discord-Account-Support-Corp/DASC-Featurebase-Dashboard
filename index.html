<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Redirecting...</title>

  <!-- Instant redirect fallback -->
  <meta http-equiv="refresh" content="0; url=https://discordaccountsupportcorporation.featurebase.app/dashboard/inbox/all">

  <!-- Speed up connection -->
  <link rel="preconnect" href="https://discordaccountsupportcorporation.featurebase.app">
  <link rel="dns-prefetch" href="https://discordaccountsupportcorporation.featurebase.app">

  <script>
    // Primary redirect (fastest method)
    window.location.replace(
      "https://discordaccountsupportcorporation.featurebase.app/dashboard/inbox/all"
    );
  </script>

  <style>
    /* Prevent white flash */
    html, body {
      margin: 0;
      background: #0f0f10;
    }
  </style>
</head>

<body>
</body>
</html>
