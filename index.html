<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Support Dashboard</title>

  <link rel="preconnect" href="https://discordaccountsupportcorporation.featurebase.app">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f10;
      color: white;
      font-family: Arial, sans-serif;
    }

    button {
      background: #5865F2;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>

  <script>
    const URL =
      "https://discordaccountsupportcorporation.featurebase.app/dashboard/inbox/all";

    function openDashboard() {
      window.location.replace(URL);
    }
  </script>
</head>

<body>
  <button onclick="openDashboard()">Open Dashboard</button>
</body>
</html>
