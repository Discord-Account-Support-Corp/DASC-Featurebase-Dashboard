<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Support Dashboard</title>

  <meta name="theme-color" content="#5865F2">
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f10;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      text-align: center;
    }

    button {
      background: #5865F2;
      border: none;
      padding: 14px 22px;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>

  <script>
    function openDashboard() {
      window.location.href =
        "https://discordaccountsupportcorporation.featurebase.app/dashboard/inbox/all";
    }

    // optional: preload connection (tiny speed boost)
    const preconnect = document.createElement("link");
    preconnect.rel = "preconnect";
    preconnect.href = "https://discordaccountsupportcorporation.featurebase.app";
    document.head.appendChild(preconnect);
  </script>
</head>

<body>
  <div class="card">
    <h2>Support Dashboard</h2>
    <p>Tap below to open</p>
    <button onclick="openDashboard()">Open Dashboard</button>
  </div>
</body>
</html>
