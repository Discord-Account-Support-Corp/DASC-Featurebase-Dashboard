<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Support Dashboard</title>

  <meta name="theme-color" content="#5865F2">
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f10;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      opacity: 0.7;
      margin-bottom: 20px;
    }

    button {
      background: #5865F2;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>

  <script>
    const DASHBOARD_URL =
      "https://discordaccountsupportcorporation.featurebase.app/dashboard/inbox/all";

    function openDashboard() {
      window.location.href = DASHBOARD_URL;
    }
  </script>
</head>

<body>
  <div class="container">
    <h1>Support Dashboard</h1>
    <p>Tap below to open your workspace</p>

    <button onclick="openDashboard()">
      Open Dashboard
    </button>
  </div>
</body>
</html>
